name: Sync Substack Posts

on:
  workflow_dispatch:
    inputs:
      skip_repo_steps:
        description: "Skip git add/commit/push steps (local testing helper)"
        required: false
        default: "false"
  schedule:
    - cron: "0 7,8 * * *"

permissions:
  contents: write

concurrency:
  group: substack-sync
  cancel-in-progress: false

jobs:
  sync-substack:
    runs-on: ubuntu-latest
    env:
      SUBSTACK_ARCHIVE_API_URL: https://emmanuelvalverderamos-substack-api.evalverde.workers.dev/
      SUBSTACK_ARCHIVE_PAGINATION: cursor
      SUBSTACK_MARKDOWN_ENDPOINT: https://substack-to-markdown.evalverde.workers.dev/?url=
      SUBSTACK_MARKDOWN_FALLBACK_ENDPOINT: https://r.jina.ai/http://
      SUBSTACK_OUTPUT_DIR: posts
      SUBSTACK_TIMEOUT_SECONDS: "30"
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_SKIP_REPO_STEPS: ${{ github.event.inputs.skip_repo_steps || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install project runtime dependencies
        run: uv sync --no-install-project

      - name: Run Substack synchronization
        run: uv run python scripts/sync_substack.py

      - name: Resolve repository steps mode
        id: repo_mode
        run: |
          resolved_skip="${SKIP_REPO_STEPS:-false}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${DISPATCH_SKIP_REPO_STEPS}" ]; then
            resolved_skip="${DISPATCH_SKIP_REPO_STEPS}"
          fi
          echo "skip_repo_steps=${resolved_skip}" >> "${GITHUB_OUTPUT}"
          echo "Resolved skip_repo_steps=${resolved_skip}"

      - name: Skip repository steps
        if: steps.repo_mode.outputs.skip_repo_steps == 'true'
        run: echo "Repository steps disabled by skip_repo_steps flag."

      - name: Configure git author
        if: steps.repo_mode.outputs.skip_repo_steps != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Stage generated markdown files
        if: steps.repo_mode.outputs.skip_repo_steps != 'true'
        run: |
          if [ -d "${SUBSTACK_OUTPUT_DIR}" ]; then
            git add "${SUBSTACK_OUTPUT_DIR}"
          else
            echo "Output directory does not exist yet; nothing to stage."
          fi

      - name: Validate staged markdown files are non-empty
        if: steps.repo_mode.outputs.skip_repo_steps != 'true'
        run: |
          staged_files="$(git diff --cached --name-only --diff-filter=AM -- 'posts/*.md')"
          if [ -z "${staged_files}" ]; then
            echo "No staged markdown files to validate."
            exit 0
          fi

          while IFS= read -r file; do
            if [ -z "${file}" ]; then
              continue
            fi

            if [ ! -s "${file}" ]; then
              echo "Empty markdown file detected: ${file}"
              exit 1
            fi
          done << EOF
          ${staged_files}
          EOF

      - name: Commit and push new posts
        if: steps.repo_mode.outputs.skip_repo_steps != 'true'
        run: |
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            exit 0
          fi

          git commit -m "chore(sync): add new Substack posts"
          git push
